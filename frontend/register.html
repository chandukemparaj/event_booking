<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — EventIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">Event<span>IQ</span></div>
    <p class="auth-subtitle">Create your free account to start booking events</p>

    <div class="form-error" id="formError"></div>

    <form id="registerForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="e.g. Priya Sharma" required>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" required minlength="6">
      </div>

      <div class="form-group">
        <label>I want to join as</label>
        <div class="role-toggle">
          <input type="radio" name="role" id="roleUser" value="user" checked>
          <label for="roleUser" class="selected" id="labelUser">🎟 Attendee</label>
          <input type="radio" name="role" id="roleOrganizer" value="organizer">
          <label for="roleOrganizer" id="labelOrganizer">🎤 Organizer</label>
        </div>
      </div>

      <button type="submit" class="btn-solid btn-full" id="submitBtn">Create Account</button>
    </form>

    <p class="auth-footer">Already have an account? <a href="login.html">Sign In</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
